# Kids Mode walk-through for CI. Every step is optional so one missing
# element does not stop the run; a screenshot follows each step.
appId: com.WahegurooNetwork.SundarGutka
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# First launch: the bani length chooser (BaniLengthSelector) appears
# because baniLength is "" in a fresh store.
- extendedWaitUntil:
    visible: "Short"
    timeout: 90000
    optional: true
- takeScreenshot: 00-first-run
- takeScreenshot: pre-tap-01
- tapOn:
    text: "Short"
    optional: true
- takeScreenshot: pre-tap-02
- tapOn:
    text: "Allow"
    optional: true
- takeScreenshot: pre-tap-03
- tapOn:
    text: "Got it"
    optional: true

- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-home

# App settings (new design): Kids Mode is a SettingsSection whose rows are
# SettingsToggleRow (whole row toggles). testIDs added on the CI branch only.
- takeScreenshot: pre-tap-04
- tapOn:
    text: "Settings"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01b-settings-top
- scrollUntilVisible:
    element:
      id: "kids-mode-toggle"
    direction: DOWN
    timeout: 40000
    centerElement: true
    optional: true
- takeScreenshot: 02a-settings-kids-off
- takeScreenshot: pre-tap-05
- tapOn:
    id: "kids-mode-toggle"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: "kids-scoring-toggle"
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- takeScreenshot: pre-tap-06
- tapOn:
    id: "kids-scoring-toggle"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "Reciter"
    direction: DOWN
    timeout: 10000
    optional: true
- assertVisible:
    text: "Check pronunciation online"
    optional: true
- takeScreenshot: 02-settings

# Reciter chooser (bottom sheet).
- takeScreenshot: pre-tap-07
- tapOn:
    text: "Reciter"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02b-reciter-chooser
- back
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02c-after-chooser
# Only leave Settings if back closed the sheet and Settings is still showing.
- runFlow:
    when:
      visible:
        id: "kids-mode-toggle"
    commands:
      - back

- extendedWaitUntil:
    visible: "Kids Mode"
    timeout: 15000
    optional: true
- takeScreenshot: 03-home-kids-icon

# Kids Mode: a fresh experience opens on the explorer chooser.
- takeScreenshot: pre-tap-08
- tapOn:
    text: "Kids Mode"
    optional: true
- extendedWaitUntil:
    visible: "A friend for your journey"
    timeout: 30000
    optional: true
- assertVisible:
    text: "Choose your explorer"
    optional: true
- takeScreenshot: 04-character

- takeScreenshot: pre-tap-09
- tapOn:
    text: "Prem Singh"
    optional: true
- takeScreenshot: pre-tap-10
- tapOn:
    text: "Begin my journey"
    optional: true
- extendedWaitUntil:
    visible: "Your bani journey"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-world

- takeScreenshot: pre-tap-11
- tapOn:
    text: "Explore Japji Sahib"
    optional: true
- extendedWaitUntil:
    visible: "One path through Japji Sahib"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-map

- takeScreenshot: pre-tap-12
- tapOn:
    text: "Pauri 1,.*"
    optional: true
- extendedWaitUntil:
    visible: "Listen and practice one line at a time"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 07-pauri

- takeScreenshot: pre-tap-13
- tapOn:
    text: "Practice"
    optional: true
- extendedWaitUntil:
    visible: "Listen and repeat"
    timeout: 15000
    optional: true
- takeScreenshot: pre-tap-14
- tapOn:
    text: "Listen"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 08-practice
- takeScreenshot: pre-tap-15
- tapOn:
    text: "Pause"
    optional: true
- takeScreenshot: pre-tap-16
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08b-back-to-pauri

- takeScreenshot: pre-tap-17
- tapOn:
    text: "Challenge"
    optional: true
- extendedWaitUntil:
    visible: "Say each line out loud. We will listen."
    timeout: 15000
    optional: true
- takeScreenshot: 09a-ready
- takeScreenshot: pre-tap-18
- tapOn:
    text: "Begin challenge"
    optional: true
- takeScreenshot: pre-tap-19
- tapOn:
    text: "While using the app"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 09-challenge
- takeScreenshot: pre-tap-20
- tapOn:
    text: "Leave challenge"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09b-after-leave

# Pauri 2 has a story plan (Pauri 1 does not), so its hub, story and
# practice screens show the illustrated scenes.
- runFlow:
    when:
      notVisible: "Journey"
    commands:
      - takeScreenshot: pre-tap-21
      - tapOn:
          text: "Back"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      notVisible: "Journey"
    commands:
      - takeScreenshot: pre-tap-22
      - tapOn:
          text: "Back"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- takeScreenshot: pre-tap-23
- tapOn:
    text: "Journey"
    optional: true
- scrollUntilVisible:
    element:
      text: "Pauri 2,.*"
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- takeScreenshot: pre-tap-24
- tapOn:
    text: "Pauri 2,.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 13-pauri-2
- scrollUntilVisible:
    element:
      text: "Walk the story"
    direction: DOWN
    timeout: 10000
    centerElement: true
    optional: true
- takeScreenshot: pre-tap-25
- tapOn:
    text: "Walk the story"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 14-story
- takeScreenshot: pre-tap-26
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "Practice"
    direction: DOWN
    timeout: 10000
    centerElement: true
    optional: true
- takeScreenshot: pre-tap-27
- tapOn:
    text: "Practice"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 15-practice-pauri-2

# Kids settings: reachable from the header of any non-tab screen.
- takeScreenshot: pre-tap-28
- tapOn:
    text: "Settings"
    optional: true
- extendedWaitUntil:
    visible: "Night mode"
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element:
      text: "Night mode"
    direction: DOWN
    timeout: 10000
    centerElement: true
    optional: true
- takeScreenshot: 10a-kids-settings
# Two matches: the row title, then the Switch (accessibilityLabel "Night mode").
- takeScreenshot: pre-tap-29
- tapOn:
    text: "Night mode"
    index: 1
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-night
- takeScreenshot: pre-tap-30
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 11-night-after-back

# Back out of Kids Mode to the main app.
- back
- back
- back
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 12-exit
