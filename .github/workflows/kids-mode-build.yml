name: Kids Mode build

on:
  push:
    branches: [ci/kids-mode-build, ci/kids-mode-build-2, ci/kids-mode-build-3, ci/kids-mode-build-4]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - uses: gradle/actions/setup-gradle@v4

      # Debug APK with the JS bundle embedded: with Metro unreachable, a
      # debug build loads assets/index.android.bundle, so no packager is
      # needed. --dev false keeps LogBox overlays off the screen.
      # This replaces the stale committed bundle for this CI build only.
      - name: Bundle JS into the APK
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          ls -la android/app/src/main/assets

      # x86_64 only: the emulator below is x86_64 and the app's default ABI
      # list is ARM only (see reactNativeArchitectures in app/build.gradle).
      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64 --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-emulator:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # On the themes-era Settings screen the emulator died with the
    # swiftshader_indirect host renderer; compare it with two other renderers.
    strategy:
      fail-fast: false
      matrix:
        gpu: [swangle_indirect]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Kids Mode flow on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim
          script: bash .maestro/run-android.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots-${{ matrix.gpu }}
          path: artifacts/
          if-no-files-found: warn

